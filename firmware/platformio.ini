; PlatformIO project for the plant sensor node.
; Built and flashed through ../build.sh (see ./build.sh help).

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    claws/BH1750 @ ^1.3.0
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bblanchon/ArduinoJson @ ^7.0.4

; Generic ESP32 DevKit (ESP32-WROOM-32). Add an [env:...] section for other boards.
[env:esp32dev]
board = esp32dev
