# Species seeded into a new database. After that, species are edited in the
# web UI (Species tab); this file is not read again.
#
# Ranges are [min, max]:
#   temperature   °C
#   humidity      % relative humidity
#   light_lux     average lux while lit (readings < 50 lx are ignored), last 24 h
#   soil_moisture % (0 = sensor in dry air, 100 = sensor in water)
#
# An optional [species.dormancy] table holds the same four ranges for the rest
# period (e.g. cactus winter dormancy). They apply to plants marked dormant.

